<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Soundscape</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="uptab">
		<img src="icons/epicgames2.png">
        <img src="icons/ue5.png">
	</div>
    <pre>
        
        
    </pre>
    <div class="font-size-Base">
	   <h1>Soundscape<h1>
    </div>
    <div class="font-size-subBase">
       <h2>Сборник материалов, связанных с Soundscape в Unreal Engine.<h2>
    </div>

	<div class="cardHero">	
        <img src="icons/ue5-hero.png.png" height="150">
    </div>
    <div class="container">
    	    	<div class="progress-bar" id="progressBar"></div>

<div class="toc" id="toc-container">
    <div class="toc-title">На этой странице</div>
    <div id="toc-list"></div>
</div>
    <!-- Карточка 1 -->
    <a href="Быстрый старт звукового ландшафта.html" class="card">
        <div class="image-container">
            <img src="icons/top2ic.png" alt="Изображение">
        </div>
        <div class="content">
            <div class="title">Быстрый старт звукового ландшафта</div>
            <div class="description">Краткое руководство по началу работы с Soundscape.</div>
        </div>
    </a>











</div>
</html>
<script>
(function() {
    let isScrolling = false;
    let scrollTimeout;
    
    document.addEventListener('DOMContentLoaded', function() {
        const tocList = document.getElementById('toc-list');
        if (!tocList) return;
        
        const headings = document.querySelectorAll('h1, h2');
        
        if (headings.length === 0) {
            tocList.innerHTML = '<div style="color: #888; padding: 8px;">Нет заголовков</div>';
            return;
        }
        
        tocList.innerHTML = '';
        
        // Создаём оглавление
        headings.forEach(heading => {
            if (!heading.id) {
                let id = heading.textContent
                    .toLowerCase()
                    .replace(/[^\wа-яё\s]/gi, '')
                    .replace(/\s+/g, '-')
                    .replace(/--+/g, '-');
                if (!id || id.length < 2) {
                    id = 'section-' + Math.random().toString(36).substr(2, 8);
                }
                heading.id = id;
            }
            
            const link = document.createElement('a');
            link.href = `#${heading.id}`;
            link.textContent = heading.textContent;
            
            if (heading.tagName === 'H2') {
                link.classList.add('h2-link');
            }
            
            // КЛИК ПО ОГЛАВЛЕНИЮ — сразу ставим активный класс и НЕ даём скроллу его сбросить
            link.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Сразу подсвечиваем эту ссылку
                document.querySelectorAll('.toc a').forEach(a => a.classList.remove('active'));
                link.classList.add('active');
                
                // Плавно скроллим
                heading.scrollIntoView({ 
                    behavior: 'smooth',
                    block: 'start'
                });
                
                // На время скролла отключаем обновление подсветки
                isScrolling = true;
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    isScrolling = false;
                    // После скролла обновляем подсветку по факту
                    updateActiveOnScroll();
                }, 500);
            });
            
            tocList.appendChild(link);
        });
        
        // Функция обновления активного пункта (без мигания)
        function updateActiveOnScroll() {
            // Если сейчас идёт кликовый скролл — не обновляем
            if (isScrolling) return;
            
            const headings = document.querySelectorAll('h1, h2');
            const links = document.querySelectorAll('.toc a');
            
            let current = '';
            const scrollPosition = window.scrollY + 120;
            
            for (let i = 0; i < headings.length; i++) {
                const heading = headings[i];
                const headingTop = heading.offsetTop;
                const headingBottom = headingTop + heading.offsetHeight;
                
                if (scrollPosition >= headingTop && scrollPosition < headingBottom) {
                    current = heading.id;
                    break;
                }
            }
            
            // Если нашли текущий заголовок — подсвечиваем его
            if (current) {
                links.forEach(link => {
                    if (link.getAttribute('href') === `#${current}`) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });
            }
        }
        
        // Полоска прогресса
        function updateProgressBar() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            const progressBar = document.getElementById('progressBar');
            if (progressBar) {
                progressBar.style.width = scrolled + '%';
            }
        }
        
        // Обработчик скролла с защитой от частых вызовов
        let ticking = false;
        window.addEventListener('scroll', function() {
            updateProgressBar();
            
            if (!ticking) {
                requestAnimationFrame(function() {
                    updateActiveOnScroll();
                    ticking = false;
                });
                ticking = true;
            }
        });
        
        // Запускаем при загрузке
        updateActiveOnScroll();
        updateProgressBar();
    });
})();
</script>
